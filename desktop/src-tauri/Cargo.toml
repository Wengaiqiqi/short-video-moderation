[package]
name = "short-video-moderation-desktop"
version = "0.1.0"
description = "短视频内容审核"
authors = ["Wengaiqiqi"]
edition = "2021"
build = "build.rs"

[lib]
name = "short_video_moderation_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
